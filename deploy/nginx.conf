# v8/D6: nginx fronting the two app replicas — least_conn, passive health
# checks (max_fails) plus the app-side /readyz compose healthcheck that keeps
# unhealthy replicas out of the pool.
# Audit P1-5/P1-6: TLS termination + security headers + rate limiting +
# /metrics ACL added; the port-80 listener is kept as redirect-only.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream enertrek_app {
    least_conn;
    server app-1:3000 max_fails=3 fail_timeout=15s;
    server app-2:3000 max_fails=3 fail_timeout=15s;
  }

  # ── Rate limiting (audit P1-5) ──────────────────────────────────────────
  # Loose global limit for the whole API…
  limit_req_zone $binary_remote_addr zone=api_global:10m rate=30r/s;
  # …and a strict one for the login endpoint (credential-stuffing brake).
  limit_req_zone $binary_remote_addr zone=auth_login:10m rate=6r/m;

  # ── Port 80: redirect-only (audit P1-5) ─────────────────────────────────
  # The listener is kept (health probes + ACME/http-01 would need it), but all
  # real traffic is forced onto https so session cookies never travel plaintext.
  server {
    listen 80;

    # Liveness of the proxy itself (compose/load-balancer probes).
    location = /healthz {
      proxy_pass http://enertrek_app;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── Port 443: TLS termination + app proxy ───────────────────────────────
  server {
    listen 443 ssl;
    http2 on;

    # Placeholder certificate paths — mount real certs at /etc/nginx/certs/
    # (e.g. via docker-compose volume or a certbot/ACME sidecar):
    #   fullchain.pem = server cert + intermediates, privkey.pem = private key.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers (audit P1-5) ─────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Simple CSP: SPA loads its own bundle/styles; inline styles are needed by
    # the UI kit. Tighten once a nonce-based build pipeline exists.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'" always;

    # ── /metrics: internal only (audit P1-6) ──────────────────────────────
    # Prometheus scrapes from localhost / the private docker network.
    # Alternative: keep it network-open but front it with basic auth:
    #   auth_basic "metrics"; auth_basic_user_file /etc/nginx/.htpasswd;
    location = /metrics {
      allow 127.0.0.1;
      allow 10.0.0.0/8;
      deny all;
      proxy_pass http://enertrek_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # Strict rate limit on the login procedure (tRPC path, batch suffix ok).
    location /api/trpc/auth.login {
      limit_req zone=auth_login burst=3 nodelay;
      proxy_pass http://enertrek_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }

    location / {
      limit_req zone=api_global burst=60 nodelay;
      proxy_pass http://enertrek_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }
  }
}
