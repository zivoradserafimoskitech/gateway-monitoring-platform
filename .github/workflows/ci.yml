# D7.1 — CI/CD quality gates.
#
# Gates (quality job, runs on every push/PR to main, or on demand for any
# branch via the Actions "Run workflow" button / workflow_dispatch):
#   1. npm ci
#   2. typecheck (tsc -b — the root tsconfig is a solution file with project
#      references, so plain `tsc --noEmit` would no-op; `npm run check` = tsc -b)
#   3. vitest with v8 coverage thresholds (enforced in vitest.config.ts)
#   4. production build (vite build + esbuild api bundle)
#   5. lint (eslint)
#   6. npm audit gate at --audit-level=high over the RUNTIME dependency tree
#      (--omit=dev): hard fails on any high/critical that actually ships. A
#      second, non-blocking step reports dev-only advisories.
#
# Timescale job: brings up a real TimescaleDB service container, applies
# db/timescale/*.sql to it and checks that reports answered from the continuous
# aggregate match the ones answered from raw rows.
#
# E2E (Playwright) job: manual (workflow_dispatch) only — see the e2e job
# comment and docs/ci.md for why it cannot run on GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates (tsc, vitest+coverage, build, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Lockfile resolves to the public registry
        # Guard against the regression that broke CI on every run from at least
        # 2026-08-13 until 2026-09-11: 479 of the lockfile's 898 tarball URLs
        # pointed at a private mirror the runners cannot reach, so `npm ci`
        # stalled and nothing downstream ever executed. Checked BEFORE the
        # install so the failure names the cause instead of timing out.
        run: |
          bad=$(grep -o '"resolved": "https\?://[^/"]*' package-lock.json \
                | sed 's/.*:\/\///' | sort -u \
                | grep -v -e '^registry\.npmjs\.org$' -e '^registry\.yarnpkg\.com$' || true)
          if [ -n "$bad" ]; then
            echo "package-lock.json resolves tarballs from non-public host(s):"
            echo "$bad"
            echo "Regenerate the lockfile against registry.npmjs.org."
            exit 1
          fi
          echo "lockfile OK — all tarballs resolve from the public registry"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage thresholds
        run: npm run test:coverage
        # vitest.config.ts enforces: lines 21 / statements 19 / branches 11 /
        # functions 5 (v8 provider). Baseline at introduction: 26.2 / 24.4 /
        # 16.8 / 10.5 — raise thresholds as coverage improves.

      - name: Build
        run: npm run build

      - name: npm audit gate (high+, runtime dependencies)
        # BLOCKING on the production dependency tree — the packages that
        # actually ship in the runtime image.
        #
        # Dev-only advisories are reported by the next step but do not fail the
        # build. A vulnerability in the bundler or the linter is a real thing to
        # track, but it is not reachable by an attacker against a deployed
        # gateway, and letting it block every pull request is how audit gates
        # end up permanently disabled.
        #
        # The allowlist used to carry the two xlsx advisories
        # (GHSA-4r6h-8v6p-xvw6, GHSA-5pgg-2g8v-p4x9). xlsx was replaced by
        # exceljs and is no longer a dependency, so those entries suppressed
        # nothing and would have hidden a genuine future finding on a package
        # that happened to reuse the id. The allowlist is now empty: add an
        # entry only alongside a comment naming the package, why no fix
        # exists, and when to revisit.
        env:
          AUDIT_ALLOW: ""
        run: |
          npm audit --omit=dev --audit-level=high --json > audit.json || true
          node -e '
            const fs = require("fs");
            // Drop empty entries: "".split(",") is [""], which would put the
            // empty string in the set and silently allow any advisory whose
            // url is missing.
            const allow = new Set((process.env.AUDIT_ALLOW ?? "").split(",").map((s) => s.trim()).filter(Boolean));
            const audit = JSON.parse(fs.readFileSync("audit.json", "utf8"));
            const bad = [];
            for (const [pkg, v] of Object.entries(audit.vulnerabilities ?? {})) {
              if (v.severity !== "high" && v.severity !== "critical") continue;
              for (const via of v.via) {
                if (typeof via !== "object") continue;
                const id = (via.url ?? "").split("/").pop();
                if (!id || !allow.has(id)) bad.push(`${v.severity}: ${pkg} — ${via.title} (${via.url})`);
              }
            }
            if (bad.length) {
              console.error("High/critical vulnerabilities in RUNTIME dependencies:\n" + bad.join("\n"));
              process.exit(1);
            }
            console.log("audit gate OK — no high/critical advisories in runtime dependencies");
          '

      - name: npm audit report (dev dependencies, informational)
        # Never fails the build. Surfaces build-time advisories so they are
        # visible and can be scheduled, rather than silently accumulating.
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=high || true

      # ---------------------------------------------------------------------
      # Scale smoke (PLACEHOLDER — not a PR gate).
      # The v2 scale-test procedure (verifier/README.md, "v2 — scale test:
      # 500 gateways + 30 PV plants + 20 BESS") needs a long-running fleet
      # (MQTT simulator at ~507 samples/s, Modbus TCP sim on ports 5101-5130,
      # ~10 min soak) plus a reachable TiDB — far beyond PR CI. Run it as a
      # scheduled/nightly job against a staging environment instead:
      #
      # - name: Scale smoke (nightly only)
      #   if: github.event_name == 'schedule'
      #   run: |
      #     npx tsx scripts/provision-fleet.ts   # pre-register meters FIRST
      #     npx tsx scripts/simulator.ts &       # 500-gw MQTT load
      #     npx tsx scripts/verify-scale.ts      # S1-S7 checks, see verifier/v2
      #     npx tsx scripts/cleanup-scale.ts     # always clean up afterwards
      # ---------------------------------------------------------------------

  timescale:
    name: TimescaleDB aggregates (integration)
    # The Timescale store answers reports older than the 90-day raw retention
    # out of a continuous aggregate. Nothing else in the repository can tell
    # whether db/timescale/*.sql is even valid SQL, let alone whether the
    # aggregate's delta/reset reconstruction agrees with the window-function
    # math over raw rows — so this job brings up a real TimescaleDB, applies
    # the files to it and compares the two answers.
    #
    # Cheap enough to run on every push: one container, one small fixture.
    runs-on: ubuntu-latest

    services:
      timescale:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_PASSWORD: timescale
          POSTGRES_DB: telemetry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d telemetry_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # Disposable container, disposable credentials.
      TIMESCALE_TEST_URL: postgres://postgres:timescale@127.0.0.1:5432/telemetry_test
      # Turns the suite's self-skip into a hard failure (see the test file).
      TIMESCALE_REQUIRED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Timescale aggregate tests
        run: npx vitest run tests/timescale-aggregates.test.ts --reporter=verbose

  e2e:
    name: Playwright E2E (login, RBAC)
    # Self-contained: the job brings its own MySQL, builds the schema from
    # db/schema.ts and seeds the two accounts the specs sign in with.
    #
    # It used to depend on `secrets.DATABASE_URL` pointing at the demo TiDB,
    # which sits behind Aliyun PrivateLink and is unroutable from a
    # GitHub-hosted runner — so the three login tests could never pass here and
    # the job was red by construction. Nothing about the suite actually needs
    # THAT database; it needs A database with two users in it.
    #
    # Still workflow_dispatch only: a browser suite takes minutes and does not
    # belong on every push. Run it before a release or when touching auth.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: e2e
          MYSQL_DATABASE: volttrade_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # Disposable database, disposable credentials — see scripts/seed-e2e-users.ts,
      # which refuses to seed these well-known passwords anywhere non-local.
      DATABASE_URL: mysql://root:e2e@127.0.0.1:3306/volttrade_e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Create the schema
        # Same path the demo image uses: snapshot db/schema.ts to SQL and apply
        # it to an empty database. drizzle-kit migrate is not usable here — its
        # journal stops at index 13 (see scripts/apply-migrations.ts).
        run: |
          npx drizzle-kit generate --config drizzle.demo.config.ts
          for f in db/demo-schema/*.sql; do
            echo "applying $f"
            # drizzle separates statements with `--> statement-breakpoint`.
            # MySQL only treats `--` as a comment when the next character is
            # whitespace, so `-->` reaches the parser as a syntax error. The
            # statements are already semicolon-terminated, so the marker lines
            # can simply be dropped. (scripts/apply-migrations.ts splits on the
            # same marker, for the same reason.)
            grep -v -e '--> statement-breakpoint' "$f" \
              | mysql -h 127.0.0.1 -P 3306 -uroot -pe2e volttrade_e2e
          done

      - name: Seed the accounts the specs use
        run: npx tsx scripts/seed-e2e-users.ts

      - name: Start app (dev server)
        run: |
          npm run dev &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/ > /dev/null

      - name: Run Playwright specs
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
