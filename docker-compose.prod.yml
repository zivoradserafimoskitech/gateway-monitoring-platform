# Enertrek Cloud — production stack for 300–500 gateways
#
#   app         this platform (API + web UI, MQTT ingestion)
#   emqx        MQTT broker the G30/C30 gateways connect to (dashboard :18083)
#   timescale   time-series storage for telemetry
#   mysql       metadata (gateways, meters, sites, rules, alarms) — use your
#               managed MySQL in real deployments via DATABASE_URL
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker exec enertrek-timescale psql -U postgres -d telemetry \
#     -f /docker-entrypoint-initdb.d/001_init.sql   # runs automatically on first boot

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://enertrek:enertrek@mysql:3306/enertrek}
      TELEMETRY_STORE: timescale
      TIMESCALE_URL: postgres://postgres:${TIMESCALE_PASSWORD:-enertrek}@timescale:5432/telemetry
      MQTT_URL: mqtt://emqx:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      TELEMETRY_FLUSH_MS: "1000"
      TELEMETRY_BATCH_MAX: "1000"
    depends_on:
      - emqx
      - timescale
      - mysql
    restart: unless-stopped

  emqx:
    image: emqx/emqx:5.8
    ports:
      - "1883:1883"   # MQTT (credentials mandatory; prefer 8883 for field gateways)
      - "8883:8883"   # MQTTS (EMQX default self-signed certs)
      - "18083:18083" # dashboard (bound to firewall-closed port; SSH tunnel only)
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_ADMIN:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_ADMIN_PASSWORD:-public}
      # Mandatory auth: clients must present a username/password stored in the
      # built-in database (users created by deploy.sh via the dashboard API).
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__NAME: sha256
      EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__SALT_POSITION: suffix
      # Default-deny ACL: anything not explicitly allowed is rejected.
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__SOURCES__1__TYPE: built_in_database
    volumes:
      - emqx-data:/opt/emqx/data
    restart: unless-stopped

  timescale:
    image: timescale/timescaledb:2.17-pg16
    environment:
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-enertrek}
      POSTGRES_DB: telemetry
    ports:
      - "5433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./db/timescale/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-enertrek}
      MYSQL_DATABASE: enertrek
      MYSQL_USER: enertrek
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-enertrek}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  emqx-data:
  timescale-data:
  mysql-data:
