# Enertrek Cloud — production HA stack (v8/D6)
#
#   nginx       reverse proxy, least_conn over the two app replicas (:80 → :3000)
#   app-1/app-2 this platform (API + web UI, MQTT ingestion, EMS/OTA/report loops)
#   emqx1/emqx2 2-node EMQX static cluster the G30/C30 gateways connect to
#               (dashboard :18083 on emqx1 only, localhost)
#   timescale   time-series storage for telemetry
#   mysql       metadata — replace with managed MySQL/TiDB via DATABASE_URL
#               in real deployments (this service then becomes optional)
#
# HA notes:
#   * WAL (telemetry write-ahead log) is PER-REPLICA local disk. NEVER put two
#     replicas on a shared WAL volume — the log format is append/offset-based
#     per process; two writers corrupt offsets and double-replay batches.
#     wal-1/wal-2 are separate named volumes for exactly this reason.
#   * MQTT ingestion is load-balanced across replicas via the shared
#     subscription "$share/enertrek/#" (used automatically when MQTT_URL is
#     set) — each telemetry message is delivered to exactly one replica.
#   * Report scheduler dedups across replicas via a conditional UPDATE claim
#     on report_schedules.last_run_at (see docs/ha.md).
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml up -d --no-deps --build app-1   # rolling, one at a time
#   docker compose -f docker-compose.prod.yml up -d --no-deps --build app-2

x-app-base: &app-base
  build: .
  environment: &app-env
    DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (no default credentials allowed)}
    TELEMETRY_STORE: timescale
    TIMESCALE_URL: postgres://postgres:${TIMESCALE_PASSWORD:?set TIMESCALE_PASSWORD}@timescale:5432/telemetry
    MQTT_URL: mqtt://emqx1:1883
    MQTT_USERNAME: ${MQTT_USERNAME:-}
    MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    TELEMETRY_FLUSH_MS: "1000"
    TELEMETRY_BATCH_MAX: "1000"
    # WAL dir must stay on replica-local storage — see header note.
    TELEMETRY_WAL_DIR: /app/data/wal
  depends_on:
    - emqx1
    - timescale
    - mysql
  restart: unless-stopped
  # Replica only joins the nginx pool once /readyz (DB + broker) is green.
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 15s
    timeout: 5s
    retries: 6
    start_period: 30s

services:
  app-1:
    <<: *app-base
    volumes:
      - wal-1:/app/data/wal
      - reports-1:/app/data/reports

  app-2:
    <<: *app-base
    volumes:
      - wal-2:/app/data/wal
      - reports-2:/app/data/reports

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
    restart: unless-stopped

  emqx1:
    image: emqx/emqx:5.8
    ports:
      - "1883:1883"   # MQTT (gateways connect here — front with a TCP LB/TLS proxy for real HA)
      - "8883:8883"   # MQTTS
      - "127.0.0.1:18083:18083" # dashboard — emqx1 only, localhost; tunnel in, never expose publicly
    environment: &emqx-env
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_ADMIN:?set EMQX_ADMIN}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_ADMIN_PASSWORD:?set EMQX_ADMIN_PASSWORD}
      # Static 2-node cluster: shared cookie + explicit seed list.
      EMQX_NODE__COOKIE: ${EMQX_COOKIE:?set EMQX_COOKIE (any shared secret string)}
      EMQX_CLUSTER__DISCOVERY_STRATEGY: static
      EMQX_CLUSTER__STATIC__SEEDS: "emqx1@emqx1,emqx2@emqx2"
      EMQX_NODE__NAME: emqx1@emqx1
    volumes:
      - emqx1-data:/opt/emqx/data
    restart: unless-stopped

  emqx2:
    image: emqx/emqx:5.8
    environment:
      <<: *emqx-env
      EMQX_NODE__NAME: emqx2@emqx2
    volumes:
      - emqx2-data:/opt/emqx/data
    restart: unless-stopped

  timescale:
    image: timescale/timescaledb:2.17-pg16
    environment:
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:?set TIMESCALE_PASSWORD}
      POSTGRES_DB: telemetry
    ports:
      - "127.0.0.1:5433:5432"  # localhost only
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./db/timescale/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: enertrek
      MYSQL_USER: enertrek
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"  # localhost only
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  wal-1:
  wal-2:
  reports-1:
  reports-2:
  emqx1-data:
  emqx2-data:
  timescale-data:
  mysql-data:
