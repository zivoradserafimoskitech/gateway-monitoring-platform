# Enertrek Cloud — production stack for 300–500 gateways
#
#   app         this platform (API + web UI, MQTT ingestion)
#   emqx        MQTT broker the G30/C30 gateways connect to (dashboard :18083)
#   timescale   time-series storage for telemetry
#   mysql       metadata (gateways, meters, sites, rules, alarms) — use your
#               managed MySQL in real deployments via DATABASE_URL
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker exec enertrek-timescale psql -U postgres -d telemetry \
#     -f /docker-entrypoint-initdb.d/001_init.sql   # runs automatically on first boot

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (no default credentials allowed)}
      TELEMETRY_STORE: timescale
      TIMESCALE_URL: postgres://postgres:${TIMESCALE_PASSWORD:?set TIMESCALE_PASSWORD}@timescale:5432/telemetry
      MQTT_URL: mqtt://emqx:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      TELEMETRY_FLUSH_MS: "1000"
      TELEMETRY_BATCH_MAX: "1000"
    depends_on:
      - emqx
      - timescale
      - mysql
    restart: unless-stopped

  emqx:
    image: emqx/emqx:5.8
    ports:
      - "1883:1883"   # MQTT (gateways connect here — expose via TLS proxy in production)
      - "8883:8883"   # MQTTS
      - "127.0.0.1:18083:18083" # dashboard — localhost only; tunnel in, never expose publicly
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_ADMIN:?set EMQX_ADMIN}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_ADMIN_PASSWORD:?set EMQX_ADMIN_PASSWORD}
    volumes:
      - emqx-data:/opt/emqx/data
    restart: unless-stopped

  timescale:
    image: timescale/timescaledb:2.17-pg16
    environment:
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:?set TIMESCALE_PASSWORD}
      POSTGRES_DB: telemetry
    ports:
      - "127.0.0.1:5433:5432"  # localhost only
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./db/timescale/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: enertrek
      MYSQL_USER: enertrek
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"  # localhost only
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  emqx-data:
  timescale-data:
  mysql-data:
